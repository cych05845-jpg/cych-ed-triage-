<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>嘉基急診學習站</title>
<meta name="theme-color" content="#14506B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: phone-first single column; sticky app bar, zone colour as the big block, bottom tab bar inside a zone; TTAS level colours carry all meaning */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --surface-2:#E6ECEF; --line:#D1DAE0;
  --ink:#16252F; --ink-2:#526570; --brand:#14506B; --brand-ink:#FFFFFF;
  --lv1:#B42318; --lv2:#D9531E; --lv3:#B7790A; --lv4:#2F855A; --lv5:#2B6CB0;
  --z-triage:#14506B; --z-leader:#5B3A8C; --z-resus:#9E2A1E; --z-treat:#1F6F5C; --z-obs:#7A5A12;
  --ok:#2F855A; --bad:#B42318; --tint:#FFF7E6; --tint-line:#E9C77A; --focus:#2B6CB0;
  --u1:#14506B; --uc:#14506B;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E181E; --surface:#16242C; --surface-2:#1E303A; --line:#2C4250;
  --ink:#E4EDF1; --ink-2:#9AB0BB; --brand:#5FA8C9; --brand-ink:#0E181E;
  --lv1:#E5544A; --lv2:#E8793E; --lv3:#C99A2E; --lv4:#3F9E6E; --lv5:#4F8FD6;
  --z-triage:#1C6687; --z-leader:#6E4CA6; --z-resus:#B23A2C; --z-treat:#2A8570; --z-obs:#957224;
  --ok:#58B884; --bad:#F0645A; --tint:#2A2414; --tint-line:#7A6430; --focus:#6AA6E8; --uc:#1C6687; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E181E; --surface:#16242C; --surface-2:#1E303A; --line:#2C4250;
  --ink:#E4EDF1; --ink-2:#9AB0BB; --brand:#5FA8C9; --brand-ink:#0E181E;
  --lv1:#E5544A; --lv2:#E8793E; --lv3:#C99A2E; --lv4:#3F9E6E; --lv5:#4F8FD6;
  --z-triage:#1C6687; --z-leader:#6E4CA6; --z-resus:#B23A2C; --z-treat:#2A8570; --z-obs:#957224;
  --ok:#58B884; --bad:#F0645A; --tint:#2A2414; --tint-line:#7A6430; --focus:#6AA6E8; --uc:#1C6687; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:14px 150px;display:grid;gap:14px}
/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--zc,var(--z-triage));color:#fff}
.appbar .in{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:54px}
.appbar h1{font-size:18px;font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar small{display:block;font-size:11.5px;font-weight:500;opacity:.85;letter-spacing:.06em}
.back{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:10px;width:38px;height:38px;font-size:20px;display:grid;place-items:center}
.strip{display:flex;gap:3px}.strip i{width:7px;height:20px;border-radius:2px;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.lvbg1{background:var(--lv1)}.lvbg2{background:var(--lv2)}.lvbg3{background:var(--lv3)}.lvbg4{background:var(--lv4)}.lvbg5{background:var(--lv5)}.lvbg0{background:var(--surface-2)}
/* home */
.hello{background:var(--z-triage);color:#fff;border-radius:18px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.hello h2{font-size:clamp(22px,5vw,30px);font-weight:900}
.hello p{margin:4px 0 0;opacity:.9}
.hello img{width:84px;height:84px}
.zones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:460px){.zones{grid-template-columns:1fr}}
.zone{border:0;text-align:left;border-radius:16px;padding:14px;color:#fff;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;min-height:112px}
.zone b{font-size:20px;display:block;font-weight:900}
.zone span{font-size:13px;opacity:.9}
.zone img{width:56px;height:56px}
.zone .st{display:table;margin-top:6px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:rgba(255,255,255,.2)}
.zone.soon{opacity:.62;cursor:default}
.zone.big{grid-column:1/-1;min-height:132px}
/* zone hub */
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mod{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;text-align:left;display:grid;gap:4px;align-content:start;color:var(--ink);text-decoration:none}
.mod img{width:44px;height:44px}
.mod b{font-size:17px}
.mod span{font-size:13px;color:var(--ink-2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.stack{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.label{font-size:12px;letter-spacing:.08em;color:var(--ink-2);font-weight:700}
.hint{font-size:13px;color:var(--ink-2)}
.note{background:var(--tint);border:1.5px solid var(--tint-line);border-radius:12px;padding:10px 12px;font-size:13.5px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--z-triage);color:#fff;border-color:var(--z-triage)}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:700;background:var(--z-triage);color:#fff}
.btn.ghost{background:transparent;color:var(--z-triage);border:1.5px solid var(--z-triage)}
:root:not([data-theme="light"]) .btn.ghost{color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
input[type=text],input[type=search]{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;width:100%;min-width:0;font-size:16px}
/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:820px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs a{display:grid;justify-items:center;gap:0;padding:7px 4px 8px;text-decoration:none;color:var(--ink-2);font-size:12px;font-weight:700}
.tabs a i{font-style:normal;font-size:20px;line-height:1.2}
.tabs a[aria-current="page"]{color:var(--z-triage)}
:root:not([data-theme="light"]) .tabs a[aria-current="page"]{color:var(--ink)}
/* lookup */
.seg4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:460px){.seg4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.seg4 button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;text-align:left}
.seg4 b{display:block;font-size:15px}.seg4 span{font-size:11.5px;color:var(--ink-2)}
.seg4 button[aria-pressed="true"]{background:var(--z-triage);border-color:var(--z-triage);color:#fff}
.seg4 button[aria-pressed="true"] span{color:#fff;opacity:.85}
.syschips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.cpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:300px;overflow:auto;padding:2px}
.cpls button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;font-size:14px;line-height:1.35}
.cpls button small{display:block;font-family:var(--f-data);font-size:11px;color:var(--ink-2)}
.cpls button[aria-pressed="true"]{border-color:var(--z-triage);background:var(--surface-2);font-weight:700}
.chosen{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chosen b{font-size:19px}
.grp{font-size:13px;font-weight:900;color:var(--ink);margin:12px 0 6px;display:flex;gap:8px;align-items:center}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.cri{display:grid;gap:6px}
.cri label{display:grid;grid-template-columns:22px 52px minmax(0,1fr);gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--surface);cursor:pointer;line-height:1.45}
.cri label:has(input:checked){border-color:var(--z-triage);background:var(--surface-2)}
.cri input{width:20px;height:20px;accent-color:var(--z-triage);margin:0}
.lvp{display:inline-grid;place-items:center;height:26px;border-radius:8px;color:#fff;font-weight:900;font-size:12.5px}
.lv{display:inline-grid;place-items:center;min-width:30px;height:26px;padding:0 6px;border-radius:7px;color:#fff;font-weight:700;font-family:var(--f-data);font-size:14px}
.l1{background:var(--lv1)}.l2{background:var(--lv2)}.l3{background:var(--lv3)}.l4{background:var(--lv4)}.l5{background:var(--lv5)}.l0{background:var(--line);color:var(--ink-2)}
.star{color:var(--z-triage);font-weight:900}
:root:not([data-theme="light"]) .star{color:var(--ink)}
/* result dock */
.dock{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:25;padding:0 10px}
.dock .in{max-width:800px;margin:0 auto;border-radius:16px;background:#7C8A96;color:#fff;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:background .25s}
.dock .in.d1{background:var(--lv1)}.dock .in.d2{background:var(--lv2)}.dock .in.d3{background:var(--lv3)}.dock .in.d4{background:var(--lv4)}.dock .in.d5{background:var(--lv5)}
.dock .big{font-size:30px;font-weight:900;font-family:var(--f-data);line-height:1;min-width:36px;text-align:center}
.dock .txt{flex:1;min-width:0;display:grid;line-height:1.35}
.dock .txt b{font-size:16px}
.dock .txt span{font-size:12.5px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock button{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;white-space:nowrap}
.dock button:disabled{opacity:.5}
.drivers{display:grid;gap:4px}
/* practice */
.case-text{font-size:18px;line-height:1.7;margin:0}
.vitals{font-family:var(--f-data);font-size:14px;background:var(--surface-2);border-radius:8px;padding:8px 12px;overflow-wrap:anywhere}
.ptag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.pbar{height:5px;background:var(--surface-2);border-radius:4px;overflow:hidden}.pbar>i{display:block;height:100%;background:var(--z-triage);transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-data);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-2)}
.verdict{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.verdict .mark{font-size:28px;font-weight:900}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.kv{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--ink-2)}.kv dd{margin:0}
.why{background:var(--surface-2);border-radius:12px;padding:12px 14px}
.review{display:grid;gap:8px}
.review button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
textarea{width:100%;min-height:110px;font-family:var(--f-data);font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:8px}
/* reference */
.refnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.refcard h3{font-size:18px;display:flex;align-items:center;gap:10px}
.refcard h3 img{width:36px;height:36px}
.vizbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vb{border:0;border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:700;background:var(--z-triage);color:#fff}
.vb.all{background:var(--surface-2);color:var(--ink)}
.vb-n{font-family:var(--f-data);font-size:12.5px;color:var(--ink-2)}
.veil{opacity:.08;filter:grayscale(1);transition:opacity .35s,filter .35s}
.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{0%{transform:scale(.94);opacity:.2}100%{transform:none;opacity:1}}
.view{animation:enter .35s ease both}
@keyframes enter{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
.foot{font-size:12px;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- visual components ---------- */
.viz{margin:18px 0 22px;display:grid;gap:10px}
.viz .cap{font-size:12.5px;color:var(--ink-2)}
.lvbg1{background:var(--lv1)}.lvbg2{background:var(--lv2)}.lvbg3{background:var(--lv3)}.lvbg4{background:var(--lv4)}.lvbg5{background:var(--lv5)}.lvbg0{background:var(--surface-2)}
/* level ladder */
.ladder{display:grid;gap:8px}
.rung{display:grid;grid-template-columns:86px minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.rung .num{color:#fff;display:grid;place-items:center;text-align:center;padding:10px 4px}
.rung .num b{font-family:var(--f-data);font-size:30px;line-height:1}
.rung .num small{display:block;font-size:12px;font-weight:700;margin-top:4px}
.rung .body{padding:10px 14px;display:grid;gap:4px;min-width:0}
.rung .top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.rung .top b{font-size:17px}
.rung .clock{font-family:var(--f-data);font-size:13px;color:var(--ink-2)}
.rung .eg{font-size:14px;color:var(--ink-2)}
/* flow */
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:stretch}
@media (max-width:640px){.flow{grid-template-columns:1fr}}
.fstep{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;display:grid;gap:6px;position:relative}
.fstep .k{font-family:var(--f-data);font-size:12px;color:var(--brand);font-weight:600;letter-spacing:.08em}
.fstep b{font-size:16px}
.fstep p{margin:0;font-size:14px;color:var(--ink-2)}
.route{display:grid;gap:6px;margin-top:4px}
.route div{display:flex;gap:8px;align-items:center;font-size:13.5px}
.route i{width:12px;height:12px;border-radius:3px;flex:none}
.arrow{color:var(--ink-2);text-align:center;font-size:20px;line-height:1}
/* scale bar */
.scale{display:grid;gap:6px}
.bar{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--line);min-height:54px}
.seg{color:#fff;padding:6px 8px;display:grid;align-content:center;gap:2px;min-width:0}
.seg b{font-family:var(--f-data);font-size:14px;white-space:nowrap}
.seg span{font-size:12px;line-height:1.3}
.seg.ok{background:var(--surface-2);color:var(--ink)}
.ticks{display:flex;font-family:var(--f-data);font-size:11.5px;color:var(--ink-2)}
/* pain grid */
.pgrid{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:6px;align-items:stretch;max-width:560px}
.pgrid .h{font-size:13px;color:var(--ink-2);font-weight:700;display:grid;place-items:center;text-align:center;padding:4px}
.pgrid .c{border-radius:10px;color:#fff;display:grid;place-items:center;padding:12px 6px;text-align:center}
.pgrid .c b{font-family:var(--f-data);font-size:24px;line-height:1}
.pgrid .c small{font-size:11.5px}
/* timeline */
.tl{position:relative;height:96px;margin:6px 8px 0}
.tl .axis{position:absolute;left:0;right:0;top:44px;height:4px;background:var(--line);border-radius:2px}
.tl .mk{position:absolute;top:0;transform:translateX(-50%);display:grid;justify-items:center;gap:4px;text-align:center}
.tl .mk .dot{width:16px;height:16px;border-radius:50%;margin-top:36px;border:3px solid var(--surface)}
.tl .mk b{font-family:var(--f-data);font-size:13px;white-space:nowrap}
.tl .mk span{font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.tl .lbl{position:absolute;top:2px;transform:translateX(-50%);display:grid;justify-items:center}
/* chips row / stepper */
.stepper{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.chipcard{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;display:grid;gap:4px;flex:1 1 150px;min-width:0}
.chipcard .k{font-family:var(--f-data);font-size:12px;color:var(--brand);font-weight:600}
.chipcard b{font-size:15px}
.chipcard p{margin:0;font-size:13.5px;color:var(--ink-2)}
.tagrow{display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-flex;gap:4px;align-items:center;font-size:12px;border-radius:999px;padding:2px 8px;color:#fff;font-weight:700}
/* mechanism */
.moi{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.moi .m{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;display:grid;gap:4px;align-content:start}
.moi .m .big{font-family:var(--f-data);font-size:22px;font-weight:600;color:var(--lv2);line-height:1.2}
.moi .m b{font-size:14.5px}
.moi .m p{margin:0;font-size:13px;color:var(--ink-2)}
.moi-h{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.06em;margin-top:6px}
/* PAT */
.pat{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:640px){.pat{grid-template-columns:1fr}}
.pat svg{width:100%;height:auto;max-width:280px;justify-self:center}
.pat svg .side{cursor:pointer}
.pat svg text{font-family:var(--f-body);font-size:13px;fill:var(--ink)}
.pat-out{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:grid;gap:6px;min-width:0}
.pat-out .state{font-size:19px;font-weight:900}
.pat-btns{display:flex;flex-wrap:wrap;gap:6px}
.pat-btns button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer}
.pat-btns button[aria-pressed="true"]{background:var(--lv1);border-color:var(--lv1);color:#fff}
/* HR range chart */
.hr{display:grid;gap:10px}
.hrrow{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;align-items:center}
.hrrow .age{font-size:13.5px;font-weight:700}
.hrtrack{position:relative;height:30px;border-radius:6px;overflow:hidden;background:var(--lv1)}
.hrtrack i{position:absolute;top:0;bottom:0}
.hrtrack em{position:absolute;top:50%;transform:translate(-50%,-50%);font-style:normal;font-family:var(--f-data);font-size:11px;color:#fff;font-weight:600}
.hraxis{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px}
.hraxis div{position:relative;height:16px;font-family:var(--f-data);font-size:11px;color:var(--ink-2)}
.hraxis span{position:absolute;transform:translateX(-50%)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* compare say */
.say{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
@media (max-width:560px){.say{grid-template-columns:1fr}}
.say .no,.say .yes{border-radius:10px;padding:9px 12px;font-size:14.5px}
.say .no{background:var(--surface-2);color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--lv1)}
.say .yes{background:var(--surface);border:1px solid var(--lv4)}
.say .hd{font-size:12px;font-weight:700;letter-spacing:.08em}
/* START */
.start{display:grid;gap:8px}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px}
.q b{font-size:15px}
.q .ans{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tri{border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700;color:#fff;white-space:nowrap}
.tri.g{background:var(--lv4)}.tri.y{background:var(--lv3)}.tri.r{background:var(--lv1)}.tri.k{background:#1f2328}
/* case cards */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin:12px 0 18px}
.case{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;display:grid;gap:8px;align-content:start}
.case .no{font-family:var(--f-data);font-size:12px;color:var(--brand);font-weight:600}
.case p{margin:0;font-size:14.5px;line-height:1.6}
.case .vs{font-family:var(--f-data);font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:4px 8px}
.case button{justify-self:start;border:1px solid var(--brand);color:var(--brand);background:transparent;border-radius:8px;padding:5px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.case .reveal{border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:4px;font-size:13.5px}
.case .reveal .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.case .cap{font-size:12.5px;color:var(--ink-2)}
.case .reveal[hidden]{display:none}
.case .reveal .row b{font-size:12.5px;color:var(--ink-2);min-width:4.5em}
.case .reveal .row span{flex:1 1 180px;min-width:0}

</style>

</head>
<body>
<header class="appbar" id="bar"><div class="in">
  <button class="back" id="backBtn" aria-label="返回" hidden>‹</button>
  <div class="strip" aria-hidden="true"><i class="lvbg1"></i><i class="lvbg2"></i><i class="lvbg3"></i><i class="lvbg4"></i><i class="lvbg5"></i></div>
  <h1 id="barTitle">嘉基急診學習站<small>急診各區訓練</small></h1>
</div></header>
<main class="wrap" id="view"></main>
<div class="dock" id="dock" hidden><div class="in" id="dockIn">
  <div class="big" id="dLv">—</div>
  <div class="txt"><b id="dName">尚未勾選</b><span id="dSub">勾選判定依據，取最高級</span></div>
  <button id="dBtn">清除</button>
</div></div>
<nav class="tabs" id="tabs" hidden><div class="in">
  <a href="#lookup" data-r="lookup"><i aria-hidden="true">⌕</i>判定查詢</a>
  <a href="#practice" data-r="practice"><i aria-hidden="true">✎</i>情境練習</a>
  <a href="#ref" data-r="ref"><i aria-hidden="true">▤</i>速查卡</a>
  <a href="#handout" data-r="handout"><i aria-hidden="true">❏</i>講義</a>
</div></nav>

<script>
/* ---------- visual components ---------- */
const T = (l, txt) => `<span class="tag lvbg${l}">${txt || l + " 級"}</span>`;
const pct = (v, lo, hi) => ((v - lo) / (hi - lo) * 100).toFixed(2) + "%";
const VIZ = {
  levels(){
    const R = [[1,"復甦急救","立即","生命或肢體需立即處置","心跳停止、休克、嚴重呼吸窘迫、GCS ≤ 8、持續抽搐"],
      [2,"危急","10 分鐘","潛在危及生命、肢體或器官功能","疑似心因性胸痛、急性明顯吐血、中樞重度疼痛、GCS 9–13"],
      [3,"緊急","30 分鐘","可能進展為嚴重問題","黑便或咖啡色嘔吐物、中樞中度疼痛、抽搐後意識恢復"],
      [4,"次緊急","60 分鐘","慢性病急性發作，處置可稍緩","局部蜂窩性組織炎、泌尿道症狀、周邊中度疼痛"],
      [5,"非緊急","120 分鐘","可轉介門診","慢性咳嗽且生命徵象正常、換藥、局部紅疹"]];
    return `<div class="ladder">${R.map(r => `<div class="rung"><div class="num lvbg${r[0]}"><div><b>${r[0]}</b><small>${r[1]}</small></div></div>
      <div class="body"><div class="top"><b>${r[3]}</b><span class="clock">再評估 ${r[2]}</span></div><div class="eg">${r[4]}</div></div></div>`).join("")}</div>
      <div class="cap">級數決定看診順序與再評估時間，不是保證的候診時間。</div>`;
  },
  flow(){
    return `<div class="flow">
      <div class="fstep"><span class="k">STEP 1</span><b>快速視診＋生命徵象</b><p>第一眼決定病人去哪裡</p>
        <div class="route"><div><i class="lvbg1"></i>心肺停止、重度窘迫、休克、無意識 → 急救室</div>
        <div><i class="lvbg2"></i>中度窘迫、循環不足、意識改變 → 治療區床邊檢傷</div>
        <div><i class="lvbg0" style="border:1px solid var(--line)"></i>明顯穩定 → 檢傷區完成</div></div></div>
      <div class="fstep"><span class="k">STEP 2</span><b>選最適當的主訴</b><p>此次來院最主要、最急迫的症狀；選症狀，不選診斷。</p>
        <div class="tagrow"><span class="tag lvbg5">非外傷 13 類</span><span class="tag lvbg5">外傷 14 類</span><span class="tag lvbg5">環境 11 類</span></div></div>
      <div class="fstep"><span class="k">STEP 3</span><b>套用調節變數</b><p>首要：呼吸、循環、意識、體溫、疼痛、機轉。次要：主訴專屬依據。</p>
        <div class="tagrow">${T(2,"多項成立取最高級")}</div></div></div>`;
  },
  spo2(){
    const lo = 85, hi = 100;
    const segs = [[85,90,1,"< 90%","重度：單字、發紺"],[90,92,2,"< 92%","中度：片語、輔助肌"],[92,95,3,"92–94%","輕度：可說句子"],[95,100,0,"≥ 95%","依其他變數"]];
    return `<div class="scale"><div class="bar">${segs.map(s => `<div class="seg ${s[2]?"lvbg"+s[2]:"ok"}" style="width:${pct(s[1],lo,0)};flex:${s[1]-s[0]}"><b>${s[3]}${s[2]?"｜"+s[2]+" 級":""}</b><span>${s[4]}</span></div>`).join("")}</div>
      <div class="cap">SpO₂ 與表現不一致時取較高級：SpO₂ 94% 但說話斷續、呼吸費力，仍是中度（2 級）。</div></div>`;
  },
  gcs(){
    const segs = [[3,8,1,"GCS 3–8｜1 級","無意識、無法保護呼吸道、持續抽搐"],[9,13,2,"GCS 9–13｜2 級","混亂、近期記憶喪失、躁動"],[14,15,0,"14–15","改用其他變數定級"]];
    return `<div class="scale"><div class="bar">${segs.map(s => `<div class="seg ${s[2]?"lvbg"+s[2]:"ok"}" style="flex:${s[1]-s[0]+1}"><b>${s[3]}</b><span>${s[4]}</span></div>`).join("")}</div>
      <div class="cap">只看急性改變（7 天內）；平日即昏迷者不以基礎 GCS 定級。</div></div>`;
  },
  pain(){
    const cell = (l, s) => `<div class="c lvbg${l}"><div><b>${l}</b><br><small>${s}</small></div></div>`;
    return `<div class="pgrid"><div></div><div class="h">重度 8–10</div><div class="h">中度 4–7</div><div class="h">輕度 0–3</div>
      <div class="h">中樞<br><small>頭胸腹、深部</small></div>${cell(2,"級")}${cell(3,"級")}${cell(4,"級")}
      <div class="h">周邊<br><small>四肢、表淺</small></div>${cell(3,"級")}${cell(4,"級")}${cell(5,"級")}</div>
      <div class="cap">兒童不分中樞周邊：重度 2 級、中度 3 級、輕度 4 級（見單元四）。</div>`;
  },
  reassess(){
    const pts = [[0,1,"立即","持續照護"],[10,2,"10 分","2 級"],[30,3,"30 分","3 級"],[60,4,"60 分","4 級"],[120,5,"120 分","5 級"]];
    const x = t => (Math.sqrt(t) / Math.sqrt(120) * 100) + "%";
    return `<div class="tl"><div class="axis"></div>${pts.map(p => `<div class="mk" style="left:${x(p[0])}"><span>${p[3]}</span><div class="dot lvbg${p[1]}"></div><b>${p[2]}</b></div>`).join("")}</div>
      <div class="cap">候診中依級數時限主動再評估；初始級數保留，另記錄新級數與時間。時間軸為示意比例。</div>`;
  },
  abcd(){
    const S = [["A / B","呼吸道與呼吸",[[1,"SpO₂ < 90%"],[2,"< 92%"]]],["C","循環",[[1,"休克"],[2,"循環不足、無法控制出血"]]],
      ["D","意識",[[1,"GCS 3–8"],[2,"GCS 9–13"]]],["P","疼痛",[[2,"中樞重度"],[3,"周邊重度"]]],["M","受傷機轉",[[2,"高危險機轉"]]]];
    return `<div class="stepper">${S.map(s => `<div class="chipcard"><span class="k">${s[0]}</span><b>${s[1]}</b><div class="tagrow">${s[2].map(t => T(t[0], t[1])).join("")}</div></div>`).join("")}</div>
      <div class="cap">依序檢查，任一項達某級即取該級，多項成立取最高級。</div>`;
  },
  moi(){
    const G = [["一般創傷",[["> 30 km/h","機車或行人、腳踏車被汽車撞","尤其人車分離"],["> 40 / > 60 km/h","汽車撞擊","未繫 / 已繫安全帶；拋出、翻覆、受困 > 20 分、同車死亡亦屬之"],["> 6 公尺","高處墜落",""],["近端穿刺","頭、頸、軀幹或手肘膝蓋以上","槍傷亦屬之"]]],
      ["頭部創傷",[["> 1 公尺","或 5 階樓梯跌落",""],["鈍器攻擊","拳腳除外",""],["彈出車外","未繫安全帶撞擋風玻璃；行人被車撞",""]]],
      ["頸部創傷",[["> 1 公尺","或 5 階樓梯跌落",""],["垂直撞擊","頭部受軸向力",""],["> 30 km/h","機車被汽車撞擊；汽車翻覆、高速",""]]]];
    return G.map(g => `<div class="moi-h">${g[0]}</div><div class="moi">${g[1].map(m => `<div class="m"><span class="big">${m[0]}</span><b>${m[1]}</b>${m[2]?`<p>${m[2]}</p>`:""}</div>`).join("")}</div>`).join("") +
      `<div class="cap">符合任一項直接判 ${T(2)}　孕婦外傷可再上調一級；單純機車自摔不屬高危險機轉。依衛福部首要調節變數表（表三）。</div>`;
  },
  fever(){
    const C = [[2,"免疫功能缺陷","化療（結束三週內）、放療、長期類固醇、移植、HIV、白血病"],[2,"疑似敗血症","中度窘迫、循環不足或意識改變任一項，且 SIRS ≥ 3"],[3,"看起來有病容","潮紅、疲倦、焦躁不安"],[4,"看起來無病容","只有發燒，心跳與意識正常"]];
    return `<div class="stepper">${C.map(c => `<div class="chipcard"><div class="tagrow">${T(c[0])}</div><b>${c[1]}</b><p>${c[2]}</p></div>`).join("")}</div>
      <div class="cap">成人發燒 > 38°C；體溫 > 41°C 或 < 32°C 直接 1 級。</div>`;
  },
  stroke(){
    const row = (name, cut, note) => `<div class="hrrow"><div class="age">${name}</div><div class="bar" style="min-height:40px">
      <div class="seg lvbg2" style="flex:${cut}"><b>< ${cut} 小時｜2 級</b></div><div class="seg lvbg3" style="flex:${8-cut}"><b>> ${cut} 小時或已緩解｜3 級</b></div></div></div>`;
    return `<div class="hr">${row("中風症狀",6)}${row("肢體無力",4.5)}</div>
      <div class="cap">衛福部 108.6.11 修正：「中風症狀」主訴以 6 小時為切點，「肢體無力」主訴以 4.5 小時為切點。一律問「最後一次看到他正常是幾點」。</div>`;
  },
  pat(){
    return `<div class="pat">
      <svg viewBox="0 0 280 250" role="img" aria-label="小兒評估三角">
        <polygon points="140,24 258,226 22,226" fill="var(--surface-2)" stroke="var(--line)" stroke-width="2"/>
        <line class="side" data-s="0" x1="140" y1="24" x2="22" y2="226" stroke-width="12" stroke-linecap="round"/>
        <line class="side" data-s="1" x1="140" y1="24" x2="258" y2="226" stroke-width="12" stroke-linecap="round"/>
        <line class="side" data-s="2" x1="22" y1="226" x2="258" y2="226" stroke-width="12" stroke-linecap="round"/>
        <text x="40" y="120" text-anchor="middle">外觀</text><text x="240" y="120" text-anchor="middle">呼吸</text><text x="140" y="246" text-anchor="middle">循環</text>
        <text x="140" y="160" text-anchor="middle" id="patMid" style="font-weight:700;font-size:15px">點選異常的面向</text>
      </svg>
      <div class="pat-out"><div class="pat-btns" id="patBtns">
        <button data-s="0" aria-pressed="false">外觀異常</button><button data-s="1" aria-pressed="false">呼吸異常</button><button data-s="2" aria-pressed="false">循環異常</button></div>
        <div class="state" id="patState">三者正常</div><div id="patWhy" class="cap">外觀：警覺、哭聲、眼神、張力、可安撫。呼吸：速率、輔助肌、鼻翼、呻吟。循環：膚色、花斑、CRT。</div></div></div>`;
  },
  pedshr(){
    const lo = 0, hi = 220;
    const R = [["< 3 個月",90,110,170,190],["3 個月–3 歲",80,90,150,170],["> 3 歲",50,60,130,150]];
    const ticks = [0,50,100,150,200];
    return `<div class="hr">${R.map(r => `<div class="hrrow"><div class="age">${r[0]}</div><div class="hrtrack">
        <i class="lvbg2" style="left:${pct(r[1],lo,hi)};width:${pct(r[2]-r[1]+lo,lo,hi)}"></i>
        <i style="left:${pct(r[2],lo,hi)};width:${pct(r[3]-r[2]+lo,lo,hi)};background:var(--surface-2)"></i>
        <i class="lvbg2" style="left:${pct(r[3],lo,hi)};width:${pct(r[4]-r[3]+lo,lo,hi)}"></i>
        <em style="left:${pct(r[1],lo,hi)}">${r[1]}</em><em style="left:${pct((r[2]+r[3])/2,lo,hi)};color:var(--ink)">${r[2]}–${r[3]}</em><em style="left:${pct(r[4],lo,hi)}">${r[4]}</em></div></div>`).join("")}
      <div class="hraxis"><div></div><div>${ticks.map(t => `<span style="left:${pct(t,lo,hi)}">${t}</span>`).join("")}</div></div>
      <div class="legend"><span><i class="lvbg1"></i>1 級範圍（須合併休克描述，否則列 2 級）</span><span><i class="lvbg2"></i>2 級（循環不足）</span><span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>不以心跳升級</span></div></div>`;
  },
  pedsfever(){
    const R = [["不分年齡","中樞體溫 > 41°C",[[1,""]]],["< 3 個月","> 38°C 或 < 36°C",[[2,"一律"]]],["3 個月–3 歲","> 38°C",[[2,"免疫缺陷／有病容"],[3,"無病容"]]],["> 3 歲","> 38°C",[[2,"免疫缺陷"],[3,"有病容"],[4,"無病容"]]]];
    return `<div class="stepper">${R.map(r => `<div class="chipcard"><span class="k">${r[1]}</span><b>${r[0]}</b><div class="tagrow">${r[2].map(t => T(t[0], t[0] + " 級" + (t[1]?" "+t[1]:""))).join("")}</div></div>`).join("")}</div>
      <div class="cap">活動力是最好的指標：會玩、會笑 vs. 躺著不動、哭聲微弱。紫斑或瘀斑合併病容 → 2 級並隔離。</div>`;
  },
  ob(){
    const R = [[1,"立即送產科","可見胎兒先露部位、臍帶脫垂；第三孕期陰道出血"],[2,"10 分鐘","急產（宮縮 ≤ 2 分鐘）或已破水；沒有胎動/胎心音；頭痛 ± 水腫 ± 高血壓；產後"],[3,"30 分鐘","宮縮間隔 > 2 分鐘；可能破水"]];
    return `<div class="ladder">${R.map(r => `<div class="rung"><div class="num lvbg${r[0]}"><div><b>${r[0]}</b><small>級</small></div></div><div class="body"><div class="eg" style="color:var(--ink)">${r[2]}</div></div></div>`).join("")}</div>`;
  },
  deesc(){
    const S = [["停下來","看著對方","放下電腦，叫出病人名字"],["接住情緒","「等這麼久，您一定很擔心。」","不辯解、不說大家都在等"],["用行動回應","「我先幫他再量一次。」","再評估是最好的安撫"],["說明現況","依病情輕重看診","告知目前有急救病人"],["給下一步","「更喘、更痛、冒冷汗，馬上找我。」","不用排隊"]];
    return `<div class="stepper">${S.map((s,i) => `<div class="chipcard"><span class="k">${i+1}</span><b>${s[0]}</b><p style="color:var(--ink)">${s[1]}</p><p>${s[2]}</p></div>`).join("")}</div>`;
  },
  say(){
    const P = [["急診本來就要等","讓您久等了，我先幫他再評估一次"],["不是我負責的","我幫您問清楚，馬上回覆您"],["你這個不急啦","他目前生命徵象穩定，我會持續注意"],["不爽可以去別家","我了解您很急，我們一起看看能怎麼幫他"],["醫生在忙，我也沒辦法","醫師正在處理急救病人，我已經幫您跟醫師說了"]];
    return `<div class="say"><div class="hd" style="color:var(--lv1)">避免說</div><div class="hd" style="color:var(--lv4)">改成</div>${P.map(p => `<div class="no">${p[0]}</div><div class="yes">${p[1]}</div>`).join("")}</div>`;
  },
  start(){
    const Q = [["能自己走嗎？",'<span class="tri g">能 → 綠</span>'],["打開呼吸道後有呼吸嗎？",'<span class="tri k">無 → 黑</span>'],["呼吸 > 30 次/分？",'<span class="tri r">是 → 紅</span>'],["橈動脈摸不到或 CRT > 2 秒？",'<span class="tri r">是 → 紅</span>'],["無法遵從簡單指令？",'<span class="tri r">是 → 紅</span><span class="tri y">都否 → 黃</span>']];
    return `<div class="start">${Q.map((q,i) => `<div class="q"><b>${i+1}. ${q[0]}</b><div class="ans">${q[1]}</div></div>`).join("")}</div>
      <div class="cap">START 為現場快速分類；傷患入院後再依 TTAS 補做正式檢傷。實際依本院大量傷患計畫。</div>`;
  },
};

const CASES = [{"id": 1, "unit": 1, "src": "課前練習", "text": "58 歲男性，胸悶 30 分鐘、冒冷汗，疼痛 6/10。", "vitals": "BP 150/90、HR 98、SpO₂ 97%", "attr": "M", "cpls": ["A0202"], "key": "A020210", "keyText": "疑似心因性胸痛/胸悶", "lv": 2, "why": "冒冷汗＋胸悶，選疑似心因性胸痛即為 2 級；檢傷即做 EKG。"}, {"id": 2, "unit": 1, "src": "課前練習", "text": "45 歲男性，氣喘病史，只能說片語、使用呼吸輔助肌。", "vitals": "SpO₂ 91%、R 28", "attr": "M", "cpls": ["A0101"], "key": "A010104", "keyText": "中度呼吸窘迫(<92%)", "lv": 2, "why": "只能說片語、用輔助肌、SpO₂ < 92%：中度呼吸窘迫。"}, {"id": 3, "unit": 1, "src": "課前練習", "text": "60 歲女性，化療中，發燒 38.3°C 2 小時，無其他不適。", "vitals": "生命徵象穩定", "attr": "M", "cpls": ["A1302"], "key": "A130208", "keyText": "發燒(免疫功能缺陷)", "lv": 2, "why": "化療中（結束三週內仍算）發燒即為免疫功能缺陷，2 級。"}, {"id": 4, "unit": 1, "src": "課前練習", "text": "72 歲女性，發燒 38.6°C、精神差、看起來有病容。", "vitals": "BP 128/70、HR 104、SpO₂ 95%", "attr": "M", "cpls": ["A1302"], "key": "A130213", "keyText": "發燒(看起來有病容)", "lv": 3, "why": "有病容 3 級；HR 異於平常但穩定也是 3 級。出現灌流不足才升 2 級。"}, {"id": 5, "unit": 1, "src": "課前練習", "text": "66 歲男性，平日意識清楚，今晨家屬發現叫不太醒。", "vitals": "E3V4M6（GCS 13）", "attr": "M", "cpls": ["A0401"], "key": "A040106", "keyText": "意識程度改變(GCS9-13)", "lv": 2, "why": "GCS 9–13 為 2 級；檢傷時測血糖排除低血糖。"}, {"id": 6, "unit": 1, "src": "課前練習", "text": "35 歲女性，右腳踝扭傷可跛行，疼痛 5/10，末梢循環與感覺正常。", "vitals": "生命徵象穩定", "attr": "T", "cpls": ["T1209"], "key": "T120903", "keyText": "急性周邊中度疼痛(4-7)", "lv": 4, "why": "周邊中度疼痛 4 級；記錄末梢循環、感覺、運動。"}, {"id": 7, "unit": 1, "src": "學會案例 18", "text": "63 歲男性，長期臥床昏迷，從護理之家送來，鼻胃管滑脫。", "vitals": "GCS 5、SpO₂ 95%、HR 74、BP 138/90", "attr": "M", "cpls": ["A1309"], "key": "A130918", "keyText": "醫療裝置問題(無其他症狀或窘迫徵象)，生命徵象正常，無發燒，無疼痛不適", "lv": 4, "why": "平日即昏迷，檢傷只看急性問題；鼻胃管滑脫無其他症狀為 4 級。"}, {"id": 8, "unit": 1, "src": "課前練習", "text": "30 歲男性，昨日縫合傷口，今日來換藥。", "vitals": "生命徵象正常，無發燒", "attr": "M", "cpls": ["A1306"], "key": "A130608", "keyText": "單純換藥，生命徵象正常，無發燒，無疼痛不適", "lv": 5, "why": "生命徵象正常、無不適的換藥為 5 級，可轉介門診。"}, {"id": 9, "unit": 1, "src": "學會案例 1", "text": "42 歲男性，沒有反應，皮膚蒼白濕冷，受傷機轉不明。看起來像中度呼吸窘迫。", "vitals": "GCS 6、SpO₂ 測不到、P 微弱、R 10、BP 測不到", "attr": "M", "cpls": ["A0401"], "key": "A040103", "keyText": "無意識(GCS3-8)", "lv": 1, "why": "不能說話、無法保護呼吸道，已符合重度；GCS 6 無意識、休克，皆為 1 級。"}, {"id": 10, "unit": 1, "src": "學會案例 14", "text": "66 歲女性，右下肢痠痛、腳踝紅腫，沒有受傷，無其他症狀，疼痛 6/10。", "vitals": "T 37.4°C、P 92、R 21、BP 222/130", "attr": "M", "cpls": ["A0204", "A0503"], "key": "A020409", "keyText": "SBP≥220mmHg或DBP≥130mmHg，無症狀", "lv": 3, "why": "下肢痛與血壓無因果，視為無症狀的重度高血壓（3 級）；發現比原主訴更需處理的問題要優先選，避免低估。"}, {"id": 11, "unit": 1, "src": "學會案例 17", "text": "40 歲女性，上腹悶痛約一天，疼痛 3/10，腹脹、胃口差、輕微噁心無嘔吐。", "vitals": "GCS 15、SpO₂ 97%、生命徵象正常", "attr": "M", "cpls": ["A0301"], "key": "A030117", "keyText": "急性中樞輕度疼痛(<4)", "lv": 4, "why": "生命徵象穩定，中樞輕度疼痛為 4 級。"}, {"id": 12, "unit": 1, "src": "學會案例 20", "text": "64 歲男性，昨天因左下肢疼痛來過急診，今天由門診轉入安排腰椎 CT。無病容，疼痛已緩解。", "vitals": "T 36.8°C、P 90、R 18、BP 130/78", "attr": "M", "cpls": ["A1308", "A1305"], "key": "A130801", "keyText": "影像檢查，生命徵象正常，無發燒，無疼痛不適", "lv": 5, "why": "影像檢查且生命徵象正常無不適為 5 級（選轉診亦可）。"}, {"id": 13, "unit": 2, "src": "課前練習", "text": "28 歲男性，騎機車被時速約 50 公里的汽車撞倒，左前臂擦傷，疼痛 3/10。", "vitals": "生命徵象穩定", "attr": "T", "cpls": ["T1203"], "key": "T120304", "keyText": "高危險性受傷機轉", "lv": 2, "why": "機車被車速 > 30 公里/小時的汽車撞擊屬高危險機轉，傷口再小也是 2 級；單純機車自摔則不算。"}, {"id": 14, "unit": 2, "src": "課前練習", "text": "40 歲男性，從約 9 公尺鷹架墜落，意識清楚，背痛 6/10。", "vitals": "BP 130/80、HR 88", "attr": "T", "cpls": ["T0101", "T1001"], "key": "T010109", "keyText": "高危險性受傷機轉", "lv": 2, "why": "> 6 公尺墜落為高危險機轉，2 級；先做頸椎與脊椎保護。"}, {"id": 15, "unit": 2, "src": "課前練習", "text": "45 歲男性，左胸被刀刺傷，傷口約 2 公分。", "vitals": "生命徵象穩定", "attr": "T", "cpls": ["T0802"], "key": "T080209", "keyText": "胸部穿刺傷", "lv": 2, "why": "胸部穿刺傷本身即 2 級，生命徵象穩定也不降級。"}, {"id": 16, "unit": 2, "src": "課前練習", "text": "70 歲女性，在家滑倒撞到頭，想不起跌倒經過，頭痛 3/10。", "vitals": "GCS 15", "attr": "T", "cpls": ["T0201"], "key": "T020116", "keyText": "外傷後有意識喪失或失憶之現象", "lv": 3, "why": "傷後失憶為 3 級；記得追問抗凝血劑。"}, {"id": 17, "unit": 2, "src": "課前練習", "text": "22 歲男性，菜刀切到左前臂，傷口 3 公分，加壓 10 分鐘後已止血。", "vitals": "生命徵象穩定", "attr": "T", "cpls": ["T1203"], "key": "T120311", "keyText": "加壓後已止血", "lv": 3, "why": "加壓後才止血為 3 級；自行停止出血為 4 級。"}, {"id": 18, "unit": 2, "src": "課前練習", "text": "55 歲男性，滑倒後右小腿明顯腫脹變形，疼痛 8/10，足背脈搏可觸及。", "vitals": "生命徵象穩定", "attr": "T", "cpls": ["T1206"], "key": "T120617", "keyText": "下肢其他部位腫脹變形，疑似骨折/脫臼", "lv": 3, "why": "小腿疑似骨折為 3 級（大腿股骨幹才是 2 級）；先固定、冰敷、抬高。"}, {"id": 19, "unit": 2, "src": "課前練習", "text": "35 歲女性，右腳踝打石膏 2 天，腳趾發紫冰冷、麻木。", "vitals": "生命徵象穩定", "attr": "T", "cpls": ["T1206"], "key": "T120611", "keyText": "石膏緊密，伴隨神經受損或肢體血管循環不佳徵象", "lv": 2, "why": "石膏過緊合併循環或神經受損為 2 級；循環正常則 4 級。"}, {"id": 20, "unit": 2, "src": "課前練習", "text": "30 歲男性，打籃球右手無名指挫傷，可彎曲，疼痛 2/10。", "vitals": "生命徵象穩定", "attr": "T", "cpls": ["T1201"], "key": "T120119", "keyText": "急性周邊輕度疼痛(<4)", "lv": 5, "why": "周邊輕度疼痛 5 級，可轉介門診。"}, {"id": 21, "unit": 2, "src": "學會案例 2", "text": "EMT 送入嚴重汽車車禍傷患，懷孕 5 個月，意識清楚，嚴重腹痛 9/10，呼吸淺快、冒冷汗、腹部僵硬。", "vitals": "T 36.1°C、P 130、R 28、BP 90/60", "attr": "T", "cpls": ["T0901"], "key": "T090103", "keyText": "休克", "lv": 1, "why": "冒冷汗、呼吸淺快屬休克 → 1 級；只看血壓或疼痛會誤判為 2 級。孕婦外傷亦可再上調一級。"}, {"id": 22, "unit": 2, "src": "學會案例 5", "text": "23 歲化學工人，化學液體噴濺到臉部，臉和左眼灼熱，無呼吸困難或口咽不適。", "vitals": "SpO₂ 96%、P 96、BP 140/88", "attr": "E", "cpls": ["E0105", "A0810"], "key": "E010509", "keyText": "化學物質濺入眼睛，造成傷害", "lv": 2, "why": "化學物質濺入眼睛造成傷害、顏面灼傷皆為 2 級；檢傷即開始沖洗。"}, {"id": 23, "unit": 2, "src": "學會案例 16", "text": "77 歲女性，昨天跌倒右手臂受傷，沒有抱怨疼痛。右手腕明顯變形，用雜誌固定，手部循環與功能正常。", "vitals": "P 62、BP 132/86", "attr": "T", "cpls": ["T1201"], "key": "T120116", "keyText": "腫脹變形，疑似骨折/脫臼", "lv": 3, "why": "不痛不等於沒事：變形疑似骨折為 3 級；循環正常所以不到 2 級。"}, {"id": 24, "unit": 2, "src": "學會案例 19", "text": "26 歲女性在海灘踩到玻璃，足踝 3 公分撕裂傷，到院時未加壓已自行止血。", "vitals": "生命徵象正常", "attr": "T", "cpls": ["T1208"], "key": "T120813", "keyText": "表淺撕裂性/出血已停止", "lv": 4, "why": "出血已自行停止為 4 級；加壓後才止血則為 3 級。"}, {"id": 25, "unit": 2, "src": "案例討論", "text": "凌晨酒醉男子扶著頭部流血的朋友到檢傷台。傷者意識清楚，頭皮撕裂 3 公分，加壓後仍持續滲血。", "vitals": "生命徵象穩定", "attr": "T", "cpls": ["T0203"], "key": "T020310", "keyText": "無法控制的出血", "lv": 2, "why": "加壓後仍出血屬無法控制的出血，2 級；也要問機轉，鈍器攻擊屬高危險。"}, {"id": 26, "unit": 3, "src": "課前練習", "text": "62 歲男性，慢跑時突然昏倒約 1 分鐘，現已清醒。", "vitals": "生命徵象穩定", "attr": "M", "cpls": ["A0206"], "key": "A020611", "keyText": "發生在運動期間", "lv": 2, "why": "運動中暈厥為 2 級；檢傷即做 EKG。"}, {"id": 27, "unit": 3, "src": "課前練習", "text": "55 歲女性，頭痛、噁心。", "vitals": "BP 226/124、HR 88", "attr": "M", "cpls": ["A0204"], "key": "A020407", "keyText": "SBP≥220mmHg或DBP≥130mmHg，伴隨任一症狀(呼吸短促、胸痛、頭痛、噁心嘔吐、眩暈)", "lv": 2, "why": "SBP ≥ 220 伴任一症狀為 2 級；SBP 或 DBP 任一達標即可。"}, {"id": 28, "unit": 3, "src": "課前練習", "text": "50 歲男性，社區量血壓 210/115，無任何不適，來急診確認。", "vitals": "BP 210/115", "attr": "M", "cpls": ["A0204"], "key": "A020411", "keyText": "SBP200-220mmHg或DBP110-130mmHg，無症狀", "lv": 4, "why": "SBP 200–220 或 DBP 110–130 且無症狀為 4 級。"}, {"id": 29, "unit": 3, "src": "課前練習", "text": "68 歲男性，2 小時前突然左手左腳無力、講話不清楚。", "vitals": "生命徵象穩定", "attr": "M", "cpls": ["A0410"], "key": "A041011", "keyText": "症狀發作時間<6小時", "lv": 2, "why": "中風症狀發作 < 6 小時為 2 級（108.6.11 修正；「肢體無力」主訴才用 4.5 小時）；問清最後正常時間並依流程啟動。"}, {"id": 30, "unit": 3, "src": "課前練習", "text": "40 歲男性，肝硬化病史，吐少量咖啡色液體。", "vitals": "生命徵象正常", "attr": "M", "cpls": ["A0309"], "key": "A030911", "keyText": "小量的嘔吐，生命徵象正常/咖啡色嘔吐物，但合併有肝硬化或食道靜脈曲張出血", "lv": 2, "why": "咖啡色嘔吐物合併肝硬化或靜脈曲張為 2 級；無此病史為 3 級。"}, {"id": 31, "unit": 3, "src": "課前練習", "text": "35 歲女性，今天解一次少量黑便，無腹痛。", "vitals": "生命徵象正常", "attr": "M", "cpls": ["A0310"], "key": "A031017", "keyText": "小量血便/黑便", "lv": 4, "why": "小量 4 級、中量 3 級、大量 2 級；記得問抗凝血劑、NSAID。"}, {"id": 32, "unit": 3, "src": "課前練習", "text": "28 歲男性，癲癇病史，在家抽搐約 2 分鐘，現在意識清楚。", "vitals": "生命徵象穩定", "attr": "M", "cpls": ["A0405"], "key": "A040516", "keyText": "抽搐已停止，意識清醒", "lv": 3, "why": "抽搐已停止且意識清醒為 3 級；持續抽搐為 1 級。"}, {"id": 33, "unit": 3, "src": "課前練習", "text": "75 歲女性，發燒 38.9°C。家屬說她平常血壓約 140/80。", "vitals": "R 24、HR 116、BP 100/58", "attr": "M", "cpls": ["A1302"], "key": "A130206", "keyText": "血行動力循環不足", "lv": 2, "why": "血壓低於平常＋心跳快：循環不足，2 級；也符合疑似敗血症。"}, {"id": 34, "unit": 3, "src": "學會案例 3", "text": "60 歲女性，發燒 2 小時，2 天前做過化療。皮膚潮紅乾暖，看起來有病容。", "vitals": "GCS 15、SpO₂ 96%、T 39°C、P 102、BP 110/80", "attr": "M", "cpls": ["A1302"], "key": "A130208", "keyText": "發燒(免疫功能缺陷)", "lv": 2, "why": "化療中發燒，生命徵象穩定仍為 2 級。"}, {"id": 35, "unit": 3, "src": "學會案例 4", "text": "68 歲女性，嚴重胸骨下疼痛放射到頸部，呼吸短促費力，說話斷斷續續，疼痛 9/10。", "vitals": "SpO₂ 91%、P 86、R 24、BP 112/78", "attr": "M", "cpls": ["A0202", "A0101"], "key": "A020210", "keyText": "疑似心因性胸痛/胸悶", "lv": 2, "why": "疑似心因性胸痛、中度呼吸窘迫、中樞重度疼痛都是 2 級；有休克或重度窘迫才是 1 級。"}, {"id": 36, "unit": 3, "src": "學會案例 8", "text": "22 歲男性，運動時暈厥，現已清醒；一週前也發生過一次。", "vitals": "GCS 15、SpO₂ 99%、P 62、BP 114/52", "attr": "M", "cpls": ["A0206"], "key": "A020611", "keyText": "發生在運動期間", "lv": 2, "why": "年輕、已清醒仍為 2 級，檢傷即做 EKG。"}, {"id": 37, "unit": 3, "src": "學會案例 9", "text": "42 歲女性，吃完海鮮麵後全身起紅疹、搔癢，以前有過敏史。", "vitals": "P 77、R 17、BP 140/89", "attr": "M", "cpls": ["A0903"], "key": "A090308", "keyText": "廣泛性紅疹", "lv": 3, "why": "廣泛性紅疹 3 級；無嚴重過敏反應描述，但仍要評估呼吸道與循環。"}, {"id": 38, "unit": 3, "src": "學會案例 10", "text": "72 歲男性，今早咳出兩口血塊，最近感冒咳嗽有痰，有支氣管擴張病史，是急診常客。", "vitals": "SpO₂ 93%、P 74、R 26、BP 136/84", "attr": "M", "cpls": ["A0105"], "key": "A010514", "keyText": "咳血塊", "lv": 3, "why": "咳血塊與輕度呼吸窘迫皆為 3 級；急診常客的急性惡化更要小心。"}, {"id": 39, "unit": 3, "src": "學會案例 11", "text": "75 歲男性，全身虛弱、頭痛、發燒 3 天，輕微呼吸費力與咳嗽。", "vitals": "GCS 14、SpO₂ 94%、T 38.5°C、P 98、R 20", "attr": "M", "cpls": ["A0205", "A1302", "A0101"], "key": "A020509", "keyText": "輕度呼吸窘迫(92-94%)", "lv": 3, "why": "輕度呼吸窘迫、發燒有病容皆為 3 級；做發燒篩檢與感控。"}, {"id": 40, "unit": 3, "src": "學會案例 15", "text": "76 歲男性，6 小時前右手突然無力、口齒不清，現在慢慢恢復。", "vitals": "GCS 15、SpO₂ 94%、P 107、BP 146/92", "attr": "M", "cpls": ["A0410"], "key": "A041017", "keyText": "症狀發作時間>6小時或已緩解", "lv": 3, "why": "發作 > 6 小時或已緩解為 3 級（108.6.11 修正，舊版為 4.5 小時）。"}, {"id": 41, "unit": 3, "src": "林口長庚示範", "text": "64 歲男性，COPD，因喘被推入急診，呼吸費力、有喘鳴，噘嘴斷斷續續說從昨天開始咳嗽、呼吸困難。", "vitals": "SpO₂ 94%、T 38.3°C、P 96、R 23", "attr": "M", "cpls": ["A0101"], "key": "A010104", "keyText": "中度呼吸窘迫(<92%)", "lv": 2, "why": "只看 SpO₂ 94% 會判 3 級；呼吸費力、說話斷續是中度窘迫，描述優先於數值。"}, {"id": 42, "unit": 3, "src": "林口長庚示範", "text": "76 歲男性，30 分鐘前開始劇烈腹痛，說「好像被扯斷」，疼痛 10/10，有高血壓。臉色蒼白、皮膚冰冷冒汗。", "vitals": "SpO₂ 94%、P 122、R 24、BP 88/68", "attr": "M", "cpls": ["A0301"], "key": "A030102", "keyText": "休克", "lv": 1, "why": "疼痛最多給到 2 級，休克徵象決定 1 級。"}, {"id": 43, "unit": 3, "src": "案例討論", "text": "72 歲女性，糖尿病與高血壓。主訴整天沒力氣、胃不太舒服，否認胸痛，皮膚微濕。", "vitals": "HR 96、BP 108/70（平常約 150/90）、SpO₂ 95%", "attr": "M", "cpls": ["A0205", "A0301"], "key": "A020505", "keyText": "血行動力循環不足", "lv": 2, "why": "血壓低於平常＋皮膚濕：循環不足 2 級；高齡女性糖尿病要警覺不典型心梗，檢傷即做 EKG。"}, {"id": 44, "unit": 3, "src": "案例討論", "text": "48 歲男性，滿身酒味，叫得醒但講話含糊。朋友說他每次都這樣。", "vitals": "HR 92、BP 132/80、SpO₂ 96%、E3V4M6", "attr": "M", "cpls": ["A1201"], "key": "A120106", "keyText": "意識程度改變(GCS9-13)", "lv": 2, "why": "依 TTAS Q&A，酒醉意識不清選物質誤用/中毒；GCS 13 為 2 級。測血糖、排除頭部外傷。"}, {"id": 45, "unit": 4, "src": "課前練習", "text": "2 個月大男嬰，發燒 38.2°C，吃奶正常，活動力佳。", "vitals": "T 38.2°C", "attr": "P", "cpls": ["P1301"], "key": "P130108", "keyText": "年齡<3M，體溫>38℃或<36℃", "lv": 2, "why": "未滿 3 個月發燒一律 2 級，活動力佳也不降級。"}, {"id": 46, "unit": 4, "src": "課前練習", "text": "1 歲半女童，發燒 39°C 一天，在候診區玩玩具、會笑。", "vitals": "T 39°C", "attr": "P", "cpls": ["P1301"], "key": "P130114", "keyText": "年齡3M~3Y，體溫>38℃，看起來無病容(活動力佳)", "lv": 3, "why": "3 個月–3 歲發燒、無病容為 3 級。"}, {"id": 47, "unit": 4, "src": "課前練習", "text": "5 歲男童，發燒 38.6°C，活動力佳，無其他不適。", "vitals": "T 38.6°C", "attr": "P", "cpls": ["P1301"], "key": "P130116", "keyText": "年齡>3Y，體溫>38℃，看起來無病容(活動力佳)", "lv": 4, "why": "3 歲以上發燒、無病容為 4 級。"}, {"id": 48, "unit": 4, "src": "課前練習", "text": "4 歲女童，發燒半天，下肢出現紫斑，精神差、一直想睡。", "vitals": "發燒", "attr": "P", "cpls": ["P1301"], "key": "P130111", "keyText": "紫斑或瘀斑，病容明顯", "lv": 2, "why": "紫斑或瘀斑合併明顯病容為 2 級，立即隔離並通知醫師。"}, {"id": 49, "unit": 4, "src": "課前練習", "text": "3 歲男童，犬吠樣咳嗽，安靜時也有喘鳴聲，鼻翼搧動併胸骨上與肋間凹陷。", "vitals": "SpO₂ 93%", "attr": "P", "cpls": ["P0109"], "key": "P010905", "keyText": "中度呼吸窘迫(<92%)", "lv": 2, "why": "凹陷與鼻翼搧動是中度窘迫；表現與 SpO₂ 不一致時取較高級。"}, {"id": 50, "unit": 4, "src": "課前練習", "text": "32 歲孕婦，懷孕 34 週，陰道出血，無腹痛。", "vitals": "生命徵象穩定", "attr": "M", "cpls": ["A1008"], "key": "A100805", "keyText": "第三孕期陰道出血", "lv": 1, "why": "第三孕期陰道出血為 1 級；不做內診，立即通知產科。"}, {"id": 51, "unit": 4, "src": "課前練習", "text": "27 歲孕婦，懷孕 38 週，宮縮每 2 分鐘一次。", "vitals": "生命徵象穩定", "attr": "M", "cpls": ["A1008"], "key": "A100813", "keyText": "急產(宮縮≤2分鐘)/已破水", "lv": 2, "why": "宮縮間隔 ≤ 2 分鐘為急產，2 級。"}, {"id": 52, "unit": 4, "src": "課前練習", "text": "35 歲孕婦，懷孕 30 週，頭痛、雙腳水腫。", "vitals": "BP 162/104", "attr": "M", "cpls": ["A1008"], "key": "A100815", "keyText": "頭痛+/-水腫+/-腹痛+/-高血壓", "lv": 2, "why": "頭痛 ± 水腫 ± 高血壓為 2 級，警覺子癲前症。"}, {"id": 53, "unit": 4, "src": "學會案例 7", "text": "3 歲兒童 1 小時前吞了奶奶的心臟藥，數量不明。意識清楚、噁心，在檢傷吐了一次。", "vitals": "SpO₂ 97%、P 70、R 24", "attr": "P", "cpls": ["P1201"], "key": "P120110", "keyText": "高危險性物質/不明物質", "lv": 2, "why": "高危險或不明物質為 2 級；3 歲心跳 70 偏慢，留意心臟藥毒性。"}, {"id": 54, "unit": 4, "src": "學會案例 12", "text": "20 歲女性，陰道出血，輕微腹部絞痛像平常經痛。近一年月經不規則，沒有性生活。", "vitals": "SpO₂ 99%、P 90、BP 110/74", "attr": "M", "cpls": ["A1005"], "key": "A100521", "keyText": "陰道出血-少量/點狀，生命徵象正常，無發燒，無疼痛不適", "lv": 4, "why": "少量出血、生命徵象正常為 4 級；若可能懷孕則為 3 級。"}, {"id": 55, "unit": 4, "src": "學會案例 13", "text": "4 歲兒童睡覺時發燒後抽搐近 1 分鐘，過去已發生 3 次、型態相同。檢傷時無病容、跑來跑去。", "vitals": "T 39°C、P 100、R 22", "attr": "P", "cpls": ["P0405"], "key": "P040519", "keyText": "抽搐已停止，意識清醒", "lv": 3, "why": "到院主因是抽搐，從抽搐判定依據選：已停止且意識清醒為 3 級，不用發燒判定。"}, {"id": 56, "unit": 4, "src": "TTAS 兒童案例", "text": "6 歲兒童氣喘發作，呈重度呼吸窘迫、發紺。", "vitals": "RR 28、HR 140、SpO₂ 84%", "attr": "P", "cpls": ["P0108", "P0101"], "key": "P010801", "keyText": "重度呼吸窘迫(<90%)", "lv": 1, "why": "發紺與 SpO₂ 84% 為重度呼吸窘迫，1 級。"}, {"id": 57, "unit": 4, "src": "TTAS 兒童案例", "text": "5 歲兒童被花生嗆到，呼吸費力。", "vitals": "RR 26、HR 120、SpO₂ 96%", "attr": "P", "cpls": ["P0106"], "key": "P010604", "keyText": "中度呼吸窘迫(<92%)", "lv": 2, "why": "SpO₂ 正常不代表沒有窘迫，呼吸費力即為中度，2 級。"}, {"id": 58, "unit": 4, "src": "TTAS 兒童案例", "text": "7 個月大，嘔吐、腹瀉含血便，已兩天拒食，活動力差。", "vitals": "BT 38°C、RR 30、HR 170、SpO₂ 96%、CRT 3 秒", "attr": "P", "cpls": ["P0305"], "key": "P030505", "keyText": "血行動力循環不足/中度脫水*", "lv": 2, "why": "HR 170、CRT 延長、活動力差為循環不足，2 級。"}, {"id": 59, "unit": 4, "src": "TTAS 兒童案例", "text": "1 歲 6 個月，發燒兩天，在家抽搐 3 分鐘，到院時已停止，但眼神呆滯、反應遲鈍。", "vitals": "RR 22、HR 130、BT 38°C", "attr": "P", "cpls": ["P0405"], "key": "P040513", "keyText": "抽搐已停止，意識仍未恢復", "lv": 2, "why": "抽搐已停止但意識未恢復為 2 級；對照學會案例 13。"}, {"id": 60, "unit": 4, "src": "TTAS 兒童案例", "text": "2 歲 7 個月，感冒多日、嘔吐，哭鬧無法安撫，眼神呆滯。", "vitals": "RR 30、HR 120", "attr": "P", "cpls": ["P1305"], "key": "P130506", "keyText": "意識程度改變(GCS9-13)", "lv": 2, "why": "無法安撫的哭鬧可能是意識改變的警訊，2 級。"}, {"id": 61, "unit": 4, "src": "TTAS 兒童案例", "text": "3 歲兒童，腹部輕度疼痛，膽汁性嘔吐，膚色紅潤、呼吸不費力。", "vitals": "RR 30、HR 150、SpO₂ 98%", "attr": "P", "cpls": ["P0301"], "key": "P030116", "keyText": "合併膽汁性嘔吐", "lv": 3, "why": "輕度疼痛只有 4 級，膽汁性嘔吐把級數拉到 3 級。"}, {"id": 62, "unit": 4, "src": "林口長庚示範", "text": "6 歲女孩腹痛、嘔吐，無發燒，活動力正常。", "vitals": "T 36.7°C、P 140、R 22、BP 90/50", "attr": "P", "cpls": ["P0301"], "key": "P030112", "keyText": "血壓或心跳有異於病人之平常數值，但血行動力穩定", "lv": 3, "why": "HR 已達 2 級數值，但不符循環不足的綜合描述，判 3 級。"}, {"id": 63, "unit": 4, "src": "TTAS 兒童案例", "text": "8 歲鐮刀型貧血兒童，發燒 38.6°C，看起來無病容。", "vitals": "脈搏呼吸正常", "attr": "P", "cpls": ["P1301"], "key": "P130110", "keyText": "年齡>3Y，體溫>38℃，免疫功能缺陷", "lv": 2, "why": "免疫功能缺陷的發燒為 2 級，看起來無病容也一樣。"}, {"id": 64, "unit": 4, "src": "案例討論", "text": "9 個月大女嬰，腹瀉 3 天、今天吐 4 次，尿布 12 小時沒濕。不太哭、眼神不追物；皮膚花斑、四肢冰涼，CRT 4 秒。", "vitals": "心跳很快、血壓正常", "attr": "P", "cpls": ["P0305"], "key": "P030502", "keyText": "休克/重度脫水*", "lv": 1, "why": "外觀＋循環異常：非代償性休克，1 級。血壓正常不能排除兒童休克。"}, {"id": 65, "unit": 4, "src": "案例討論", "text": "28 歲女性，右下腹痛 3 小時，疼痛 6/10，起身會頭暈。最後月經約 7 週前。", "vitals": "HR 112、BP 96/60、SpO₂ 98%", "attr": "M", "cpls": ["A0301", "A1009"], "key": "A030105", "keyText": "血行動力循環不足", "lv": 2, "why": "循環不足 2 級（中樞中度疼痛 3 級，取高）；優先懷疑子宮外孕。"}, {"id": 66, "unit": 5, "src": "學會案例 6", "text": "26 歲女性，從密閉車庫中被救出，當時汽車引擎仍發動。意識清楚，不願眼神接觸、不回答問題，但配合檢傷。", "vitals": "P 102、R 22、BP 118/76", "attr": "M", "cpls": ["A1101"], "key": "A110101", "keyText": "企圖自殺或者有明確的計畫", "lv": 2, "why": "有明確計畫的自殺企圖為 2 級；同時評估一氧化碳暴露，不讓病人獨處。"}];

/* ---------- router ---------- */
let route = "";
function go(r){ if (location.hash !== "#" + r) location.hash = r; else render(); }
addEventListener("hashchange", render);
function setBar(title, sub, back, zone){
  $("barTitle").innerHTML = `${esc(title)}<small>${esc(sub)}</small>`;
  $("backBtn").hidden = !back; $("backBtn").onclick = () => go(back || "home");
  document.documentElement.style.setProperty("--zc", `var(${zone || "--z-triage"})`);
}
function render(){
  route = (location.hash || "#home").slice(1) || "home";
  $("dock").hidden = true;
  const inTriage = ["lookup","practice","ref","handout"].includes(route);
  $("tabs").hidden = !inTriage;
  document.querySelectorAll("#tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.r === route ? "page" : "false"));
  const v = $("view"); v.classList.remove("view"); void v.offsetWidth; v.classList.add("view");
  ({ home, triage, lookup, practice: pHome, ref, handout }[route] || home)();
  window.scrollTo({ top: 0 });
}

const REFS = [["levels","五級定義與再評估","levels"],["flow","判定三步驟","flow"],["spo2","呼吸窘迫 SpO₂","lungs"],["gcs","意識程度 GCS","brain"],["pain","疼痛：分數 × 部位","pain"],
  ["reassess","再評估時間軸","timer"],["abcd","外傷 ABCD-P-M","bandage"],["moi","高危險受傷機轉","crash"],["fever","成人發燒","fever"],["stroke","中風時間","brain"],
  ["pat","小兒評估三角","baby"],["pedshr","兒童心跳區間","child"],["pedsfever","兒童發燒","fever"],["ob","懷孕大於 20 週","preg"],["start","START 大量傷患","siren"]];
function ref(){
  setBar("速查卡", "點「逐步看」可一項一項出現", "triage");
  $("view").innerHTML = `<div class="refnav">${REFS.map(r => `<a class="chip" href="#ref" data-j="${r[0]}" style="text-decoration:none;color:inherit">${r[1]}</a>`).join("")}</div>` +
    REFS.map(r => `<section class="panel stack refcard" id="ref-${r[0]}"><h3>${img(r[2])}${r[1]}</h3><div class="viz">${VIZ[r[0]]()}</div></section>`).join("") +
    `<p class="foot">依衛福部急診五級檢傷分類基準與首要調節變數表整理；中風：成人「中風症狀」6 小時、「肢體無力」4.5 小時，兒童 4.5 小時。</p>`;
  bindPat($("view"));
  $("view").querySelectorAll(".viz").forEach(v => { const items = stepItems(v); if (items.length < 3) return;
    const bar = document.createElement("div"); bar.className = "vizbar";
    bar.innerHTML = `<button type="button" class="vb next">▶ 逐步看</button><button type="button" class="vb all" hidden>全部顯示</button><span class="vb-n" aria-live="polite"></span>`;
    v.prepend(bar); v._items = items; v._i = -1; });
  $("view").onclick = e => { const vb = e.target.closest(".vb"); if (vb){ vizStep(vb.closest(".viz"), vb.classList.contains("all") ? "all" : "next"); return; }
    const j = e.target.closest("[data-j]"); if (j){ e.preventDefault(); $("ref-" + j.dataset.j).scrollIntoView({ behavior: "smooth", block: "start" }); } };
}
function stepItems(v){
  const sel = [".ladder > .rung", ".flow > .fstep", ".stepper > .chipcard", ".moi > .m", ".start > .q", ".pgrid > .c", ".tl > .mk", ".hr > .hrrow", ".bar > .seg", ".say > .yes"];
  for (const s of sel){ const f = [...v.querySelectorAll(s)]; if (f.length >= 3) return s === ".bar > .seg" && v.querySelector(".hr") ? [...v.querySelectorAll(".hrrow")] : f; }
  return [];
}
function vizStep(v, mode){
  const it = v._items, bar = v.querySelector(".vizbar");
  if (mode === "all"){ it.forEach(x => x.classList.remove("veil","pop")); v._i = -1; bar.querySelector(".next").textContent = "▶ 逐步看"; bar.querySelector(".all").hidden = true; bar.querySelector(".vb-n").textContent = ""; return; }
  if (v._i < 0 || v._i >= it.length){ it.forEach(x => x.classList.add("veil")); v._i = 0; }
  const x = it[v._i]; x.classList.remove("veil"); x.classList.add("pop"); v._i++;
  bar.querySelector(".all").hidden = false; bar.querySelector(".vb-n").textContent = `${v._i} / ${it.length}`;
  bar.querySelector(".next").textContent = v._i >= it.length ? "↺ 重來" : "▶ 下一個";
}
